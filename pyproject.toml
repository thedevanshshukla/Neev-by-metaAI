[project]
name = "neev-exp"
version = "0.1.0"
description = "Neev experimentation harness: validate SAM 3.1 and Muse Wonder for seismic street screening"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# Core, unit tests, and the smoke test are standard-library only.
# Mask overlays need Meta's official decoder; boxes work without it.
dev = ["pytest>=8", "numpy>=1.26", "scipy>=1.12"]
masks = ["meta-sam-parser>=0.0.6"]
viz = ["pillow>=10"]
# Phase 7 inspection web app (neev/app). The core stays dependency-free;
# install this extra only to serve the app or run its endpoint tests.
app = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.29",
       "httpx>=0.27", "pillow>=10"]
eval = ["numpy>=1.26", "scipy>=1.12"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
