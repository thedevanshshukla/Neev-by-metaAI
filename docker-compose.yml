version: "3.8"

services:
  neev:
    build: .
    container_name: neev-screening-workstation
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
    volumes:
      - ./runs:/app/runs

